# quire on your tailnet, and nowhere else.
#
# A Tailscale sidecar owns the network namespace; quire publishes no host
# port at all and is reachable only at https://<TS_HOSTNAME>.<tailnet>.ts.net
# with Tailscale-managed TLS. Nothing here touches the public internet — if
# you want share links to work for people outside your tailnet, use the
# ../tailscale-funnel sample instead.
#
#   cp .env.sample .env && $EDITOR .env && docker compose up -d
#   docker compose logs quire | grep enrollment_code   # to claim it
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:?set TS_HOSTNAME in .env}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=${TS_TAGS:-tag:container}
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    cap_add:
      - net_admin
    restart: unless-stopped

  quire:
    image: ghcr.io/jclement/quire:${QUIRE_TAG:-latest}
    # Share the sidecar's namespace: quire's port never leaves it.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./data:/data
    environment:
      # 0.0.0.0 *inside the shared namespace*. Nothing outside it can reach
      # this either way, but binding a non-loopback address is what makes
      # quire refuse auth mode "none" — and it must, because the sidecar can
      # reach loopback here, so "loopback means local only" is not true.
      QUIRE_ADDR: 0.0.0.0:8321
      QUIRE_BASE_URL: ${QUIRE_BASE_URL:?set QUIRE_BASE_URL in .env}
      QUIRE_AUTH_MODE: ${QUIRE_AUTH_MODE:-passkey}
    restart: unless-stopped
