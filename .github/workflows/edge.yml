# Images that track main, so a self-hosted deployment can follow development
# without waiting for a tagged release:
#
#   ghcr.io/jclement/quire:edge        — always the newest main
#   ghcr.io/jclement/quire:main-<sha>  — a specific commit, to pin or roll back
#
# Tagged releases still come from release.yml and are what :latest points at.
name: edge
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# A newer push makes an in-flight build pointless; let it go.
concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run setup

      # The SPA is embedded in the binary, so it has to exist before go build.
      - name: Build frontend
        run: mise run gen && bun run --cwd web build

      # Cross-compile natively rather than under emulation. CGO stays off, so
      # both targets are static binaries.
      - name: Cross-compile
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -tags prod -ldflags "-s -w -X main.version=edge-${GITHUB_SHA::7}" \
              -o "dist/quire_linux_$arch" .
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jclement/quire:edge
            ghcr.io/jclement/quire:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
