# Release: on a v* tag, build the frontend, then GoReleaser produces the
# binaries (with the frontend embedded via -tags prod) and pushes the
# multi-arch Docker image to ghcr.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      # Both are required: the arm64 image runs its RUN step under emulation,
      # and buildx's default docker driver refuses --platform builds outright.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: mise run setup
      - name: Build frontend
        run: bun run --cwd web build
      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
