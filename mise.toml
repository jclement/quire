# quire — toolchain + task contract (see README.md for what each task does)

[tools]
go = "1.27.0"
bun = "1.4.0"

[env]
# Dev instance: single-user, no auth, localhost only. Real deployments set
# QUIRE_AUTH_MODE=passkey and a proper base URL via environment/config.
QUIRE_DATA_DIR = "{{config_root}}/tmp/data"
QUIRE_AUTH_MODE = "none"
QUIRE_ADDR = "127.0.0.1:8321"

[tasks.setup]
description = "Zero → runnable: Go modules, frontend deps, dev vault dir"
run = [
  "go mod download",
  "bun install --cwd web",
  "mkdir -p tmp/data",
]

[tasks.dev]
description = "Run dev instance (single user, no auth, localhost) — Go API + Vite with HMR"
run = "./scripts/dev.sh"

[tasks.gen]
description = "Generate the frontend's TypeScript types from the Go API structs"
run = [
  "go run github.com/gzuidhof/tygo@v0.2.21 generate",
  # Format it like the rest of the frontend so `lint` is happy and the file
  # stays readable when someone opens it to check a shape.
  "bun run --cwd web prettier --write src/api/generated.ts",
]

[tasks.test]
description = "Full test suite: Go (-race) + frontend"
run = [
  "go test -race ./...",
  "bun test --cwd web",
]

[tasks."test:go"]
description = "Go tests only"
run = "go test -race ./..."

[tasks.lint]
description = "Lint + typecheck + format-check (never mutates)"
run = [
  "test -z \"$(gofmt -l main.go internal)\" || { gofmt -l main.go internal; exit 1; }",
  "go vet ./...",
  "bun run --cwd web typecheck",
  "bun run --cwd web lint",
  # Generated types must match the Go structs — a stale checked-in file means
  # the frontend is typechecking against an API that no longer exists.
  "./scripts/check-generated.sh",
]

[tasks.fmt]
description = "Format Go + frontend (mutating counterpart of lint)"
run = [
  "gofmt -w .",
  "bun run --cwd web fmt",
]

[tasks.check]
description = "lint + test — the gate before claiming work is done"
depends = ["lint", "test"]

[tasks.build]
description = "Production build: frontend → embedded assets → single binary"
run = [
  "mise run gen",
  "bun run --cwd web build",
  "go build -tags prod -o bin/quire .",
]

[tasks."dev:reset"]
description = "Blow away local state (dev vault, index db, frontend caches)"
run = [
  "rm -rf tmp bin web/dist web/node_modules/.vite",
]
