# GoReleaser: single static binary per platform with the frontend embedded
# (-tags prod; the release workflow builds web/dist first), plus a multi-arch
# Docker image at ghcr.io/jclement/quire.
version: 2

builds:
  - id: quire
    main: .
    flags:
      - -tags=prod
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "quire_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

dockers:
  - image_templates: ["ghcr.io/jclement/quire:{{ .Version }}-amd64"]
    use: buildx
    goarch: amd64
    build_flag_templates: ["--platform=linux/amd64"]
  - image_templates: ["ghcr.io/jclement/quire:{{ .Version }}-arm64"]
    use: buildx
    goarch: arm64
    build_flag_templates: ["--platform=linux/arm64"]

docker_manifests:
  - name_template: "ghcr.io/jclement/quire:{{ .Version }}"
    image_templates:
      - "ghcr.io/jclement/quire:{{ .Version }}-amd64"
      - "ghcr.io/jclement/quire:{{ .Version }}-arm64"
  - name_template: "ghcr.io/jclement/quire:latest"
    image_templates:
      - "ghcr.io/jclement/quire:{{ .Version }}-amd64"
      - "ghcr.io/jclement/quire:{{ .Version }}-arm64"

# The same binary is the CLI (`quire task add`, `quire search`, `quire today`)
# pointed at QUIRE_URL, so it is worth having on a laptop even when the server
# runs in Docker.
#
# skip_upload is guarded rather than assumed: without HOMEBREW_TAP_TOKEN in
# the repo's secrets the formula is simply not published, instead of failing
# the whole release over a convenience artifact.
homebrew_casks:
  - name: quire
    repository:
      owner: jclement
      name: homebrew-tap
      # goreleaser validates this field's *form*: it must be exactly
      # {{ .Env.VAR }}, with no other interpolation. Not evaluated unless an
      # upload is actually attempted, so a snapshot build without the
      # variable is fine.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # skip_upload is an ordinary template, so it can be defensive: `index`
    # yields "" for an absent key where `.Env.X` would be a hard error, and
    # unlike envOrDefault it exists in every goreleaser version (assuming it
    # did cost two releases). An unset token therefore skips the formula
    # rather than failing the release.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/jclement/quire
    description: Self-hosted personal knowledge and work hub — markdown on disk, agent-operable over MCP
    license: MIT
    hooks:
      post:
        # Downloaded binaries carry the quarantine attribute, which makes
        # macOS refuse to run them until it is cleared.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/quire"]
          end

changelog:
  use: github-native

release:
  footer: |
    Docker: `ghcr.io/jclement/quire:{{ .Version }}`
